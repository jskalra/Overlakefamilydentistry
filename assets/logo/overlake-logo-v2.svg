<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Overlake Family Dentistry — Conservative, Tooth-Preserving Care">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Inter:wght@500;600;700&amp;display=swap');
      .word  { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; }
      .sub   { font-family: 'Inter','Helvetica Neue',Arial,sans-serif; font-weight: 600; }
      .fine  { font-family: 'Inter','Helvetica Neue',Arial,sans-serif; font-weight: 600; }
      .navy  { fill: #1e3a52; }
      .slate { fill: #5f7488; }
    </style>
  </defs>

  <!-- Leaf mark -->
  <g transform="translate(380 96) rotate(22)">
    <path d="M0 -54 C 35 -35, 42 27, 0 62 C -42 27, -35 -35, 0 -54 Z" fill="#8bab97"/>
    <path d="M0 -54 C 21 -31, 23 27, 0 62 C 0 20, 0 -20, 0 -54 Z" fill="#6f9a80"/>
    <path d="M0 -46 L 0 56" stroke="#f4f1e8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>

  <!-- Wordmark: Playfair (Overlake) + Inter (Family Dentistry) -->
  <text x="380" y="240" text-anchor="middle" class="word navy" font-size="96">Overlake</text>
  <text x="380" y="296" text-anchor="middle" class="sub slate" font-size="42" letter-spacing="10">FAMILY DENTISTRY</text>

  <!-- Tagline -->
  <text x="380" y="342" text-anchor="middle" class="fine navy" font-size="20" letter-spacing="3">CONSERVATIVE, TOOTH-PRESERVING CARE</text>

  <!-- Heritage line -->
  <text x="380" y="374" text-anchor="middle" class="fine slate" font-size="14" letter-spacing="2">FORMERLY DR. BRIAN BROOKS DENTISTRY</text>
</svg>
